[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "redteam-lab"
version = "0.2.0"
description = "Scenario planning and evidence journal for reproducible Red Team labs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gustavo Oliveira" }]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "pytest>=8.3,<9", "ruff>=0.12,<1"]

[project.scripts]
rtl = "redteam_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
